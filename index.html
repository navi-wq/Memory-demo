<!DOCTYPE html>
<html lang="en">

<head>

<style>

/* =========================
   BASIC
========================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #000;
  color: white;
  font-family: Georgia, "Times New Roman", serif;
}


/* =========================
   OPENING VIDEO
========================= */

.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.hero video {
  position: absolute;
  width: 90%;
  height: 100%;
  object-fit: contain;
  top: 0;
  left: 3%;
  z-index: 2;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.20),
    rgba(0,0,0,0.65)
  );
  z-index: 1;
}

.names {
  position: absolute;
  z-index: 3;
  left: 20px;
  right: 20px;
  bottom: 80px;
  text-align: center;
}

.names .small {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 14px;
  opacity: 0.9;
}

.names h1 {
  font-size: 42px;
  font-weight: 400;
  letter-spacing: 1px;
  text-shadow: 0 3px 15px rgba(0,0,0,0.5);
}

.names p {
  margin-top: 12px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  opacity: 0.9;
}

.scroll {
  position: absolute;
  z-index: 3;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  opacity: 0.8;
}


/* =========================
   HALDI
========================= */

.haldi-section {
  padding: 70px 18px 80px;
  background: linear-gradient(
    180deg,
    #fff8df 0%,
    #fffdf5 100%
  );
  color: #5b4216;
  text-align: center;
}

.haldi-heading .haldi-kicker {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 10px;
  opacity: 0.75;
}

.haldi-heading h2 {
  font-family: Georgia, serif;
  font-size: 38px;
  font-weight: 400;
  letter-spacing: 3px;
}

.haldi-heading p {
  margin-top: 10px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 1.5px;
  opacity: 0.8;
}

.haldi-grid {
  margin: 35px auto 0;
  max-width: 520px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.haldi-grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  border-radius: 12px;
}


/* =========================
   STORY SECTIONS
========================= */

.story-section {
  padding: 75px 18px 85px;
  text-align: center;
}

.story-heading {
  max-width: 500px;
  margin: auto;
}

.story-kicker {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 12px;
  opacity: 0.65;
}

.story-heading h2 {
  font-family: Georgia, serif;
  font-size: 38px;
  font-weight: 400;
  letter-spacing: 3px;
}

.story-heading p {
  margin: 18px auto 0;
  max-width: 430px;
  font-family: Georgia, serif;
  font-size: 15px;
  line-height: 1.8;
  opacity: 0.85;
}

.story-grid {
  margin: 38px auto 0;
  max-width: 520px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.story-grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  border-radius: 12px;
}

========================= */

.mehendi-section {
  background: #f5eee4;
  color: #49372b;
}


/* =========================

}

  margin-bottom: 12px;
}

.shagun-title {
  font-family: Georgia, serif;
  font-size: 34px;
  font-weight: 400;
  letter-spacing: 3px;
}

.shagun-subtitle {
  margin-top: 12px;
  font-family: Georgia, serif;
  font-size: 14px;
  opacity: 0.75;
}


/* =========================
   SHAGUN CARD AREA
========================= */

.shagun-card-area {
  width: 300px;
  height: 270px;

  margin: 60px auto 45px;

  position: relative;

  display: flex;

  align-items: center;

  justify-content: center;
}


/* =========================
   SOFT GLOW
========================= */

.shagun-glow {
  position: absolute;

  width: 220px;
  height: 220px;

  border-radius: 50%;

  background: rgba(255,255,255,0.55);

  filter: blur(25px);

  animation:
    shagunGlow
    3s
    ease-in-out
    infinite;
}


/* =========================
   BLESSING CARD
========================= */

.shagun-card {
  position: relative;

  z-index: 2;

  width: 270px;

  min-height: 175px;

  padding: 30px 20px;

  background: #fffaf1;

  border: 1px solid rgba(130,90,55,0.18);

  border-radius: 10px;

  box-shadow:
    0 18px 40px rgba(80,50,30,0.20);

  animation:
    shagunReveal
    3s
    ease-in-out
    infinite;
}


/* CARD DECORATION */

.shagun-card::before {
  content: "✦";

  display: block;

  font-size: 18px;

  margin-bottom: 12px;

  opacity: 0.65;
}


/* CARD TEXT */

.shagun-card-title {
  font-family: Georgia, serif;

  font-size: 21px;

  color: #6b4734;
}

.shagun-card-names {
  margin-top: 14px;

  font-family: Georgia, serif;

  font-size: 18px;

  color: #8a5a43;
}

.shagun-card-message {
  margin-top: 12px;

  font-family: Arial, sans-serif;

  font-size: 11px;

  line-height: 1.6;

  letter-spacing: 1px;

  opacity: 0.65;
}
