<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rahul & Priya ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #000;
  color: white;
  font-family: Georgia, "Times New Roman", serif;
}

/* Opening video */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.hero video {
  position: absolute;
  width: 82%;
  height: 100%;
  object-fit: contain;
  top: 0;
  left: 9%;
  z-index: 1;
}

.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.hero::before {
  content: "";
  position: absolute;
  inset: -20px;
  background-image: url("./couple-video.mp4");
  background-size: cover;
  background-position: center;
  filter: blur(25px);
  transform: scale(1.1);
  z-index: 0;
}

/* Dark overlay */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.20),
    rgba(0,0,0,0.65)
  );
}

/* Names */
.names {
  position: absolute;
  z-index: 2;
  left: 20px;
  right: 20px;
  bottom: 80px;
  text-align: center;
}

.names .small {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 14px;
  opacity: 0.9;
}

.names h1 {
  font-size: 42px;
  font-weight: 400;
  letter-spacing: 1px;
  text-shadow: 0 3px 15px rgba(0,0,0,0.5);
}

.names p {
  margin-top: 12px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  opacity: 0.9;
}

/* Scroll indication */
.scroll {
  position: absolute;
  z-index: 3;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  opacity: 0.8;
}
</style>
</head>

<body>

<section class="hero">

  <video
    autoplay
    muted
    playsinline
    loop
    preload="auto"
  >
    <source src="./couple-video.mp4" type="video/mp4">
  </video>

  <div class="names">
    <div class="small">A Beautiful Beginning</div>

    <h1>Rahul &amp; Priya</h1>

    <p>Our Story • Our Memories • Forever</p>
  </div>

  <div class="scroll">
    ↓ SCROLL TO DISCOVER
  </div>

</section>
<div id="startScreen" style="
  position: fixed;
  inset: 0;
  z-index: 9999;
  background-image:
    linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.45)),
    url('./couple.jpg');
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
">

  <div style="
    padding: 35px 25px;
    width: 90%;
    max-width: 400px;
  ">

    <div style="
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 18px;
      opacity: 0.9;
    ">
      A Beautiful Beginning
    </div>

    <div style="
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: 400;
      text-shadow: 0 3px 15px rgba(0,0,0,0.7);
    ">
      Rahul &amp; Priya ❤️
    </div>

    <div style="
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      margin-top: 14px;
      opacity: 0.9;
    ">
      Our Story • Our Memories • Forever
    </div>

    <div style="
      margin-top: 45px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      padding: 14px 28px;
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 30px;
      display: inline-block;
      background: rgba(0,0,0,0.25);
    ">
      TAP TO ENTER
    </div>

  </div>
</div>

<audio id="bgMusic">
  <source src="Dil Diyan Gallan Song.mp3" type="audio/mpeg">
</audio>

<script>
const startScreen = document.getElementById("startScreen");
const music = document.getElementById("bgMusic");
const video = document.querySelector(".hero video");

startScreen.addEventListener("click", function () {
  music.play();
  video.play();
  startScreen.style.display = "none";
});
</script>

</body>
</html>
