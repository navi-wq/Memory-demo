<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rahul & Priya ❤️</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #000;
  color: white;
  font-family: Georgia, "Times New Roman", serif;
}

/* =========================
   OPENING VIDEO
========================= */

.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.hero video {
  position: absolute;
  width: 90%;
  height: 100%;
  object-fit: contain;
  top: 0;
  left: 3%;
  z-index: 2;
}

/* Dark overlay */

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.20),
    rgba(0,0,0,0.65)
  );
  z-index: 1;
}

/* Names */

.names {
  position: absolute;
  z-index: 3;
  left: 20px;
  right: 20px;
  bottom: 80px;
  text-align: center;
}

.names .small {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 14px;
  opacity: 0.9;
}

.names h1 {
  font-size: 42px;
  font-weight: 400;
  letter-spacing: 1px;
  text-shadow: 0 3px 15px rgba(0,0,0,0.5);
}

.names p {
  margin-top: 12px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  opacity: 0.9;
}

/* Scroll indication */

.scroll {
  position: absolute;
  z-index: 3;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  opacity: 0.8;
}


/* =========================
   HALDI SECTION
========================= */

.haldi-section {
  padding: 70px 18px 80px;
  background: linear-gradient(
    180deg,
    #fff8df 0%,
    #fffdf5 100%
  );
  color: #5b4216;
  text-align: center;
}

.haldi-heading .haldi-kicker {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 10px;
  opacity: 0.75;
}

.haldi-heading h2 {
  font-family: Georgia, serif;
  font-size: 38px;
  font-weight: 400;
  letter-spacing: 3px;
  margin: 0;
}

.haldi-heading p {
  margin-top: 10px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 1.5px;
  opacity: 0.8;
}

.haldi-grid {
  margin: 35px auto 0;
  max-width: 520px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.haldi-grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  border-radius: 12px;
}

</style>

</head>


<body>


<!-- =========================
     OPENING VIDEO
========================= -->

<section class="hero">

  <video
    autoplay
    muted
    playsinline
    loop
    preload="auto"
  >
    <source src="./couple-video.mp4" type="video/mp4">
  </video>

  <div class="names">

    <div class="small">
      A Beautiful Beginning
    </div>

    <h1>
      Rahul &amp; Priya
    </h1>

    <p>
      Our Story • Our Memories • Forever
    </p>

  </div>

  <div class="scroll">
    ↓ SCROLL TO DISCOVER
  </div>

</section>


<!-- =========================
     HALDI
========================= -->

<section class="haldi-section">

  <div class="haldi-heading">

    <div class="haldi-kicker">
      A Little Sunshine
    </div>

    <h2>
      HALDI
    </h2>

    <p>
      Where the celebrations began
    </p>

  </div>


  <div class="haldi-grid">

    <img src="./haldi1.jpg" alt="Haldi memory 1">

    <img src="./haldi2.jpg" alt="Haldi memory 2">

    <img src="./haldi3.jpg" alt="Haldi memory 3">

    <img src="./haldi4.jpg" alt="Haldi memory 4">

  </div>

</section>


<!-- =========================
     TAP TO ENTER SCREEN
========================= -->

<div id="startScreen" style="
  position: fixed;
  inset: 0;
  z-index: 9999;
  background-image:
    linear-gradient(
      rgba(0,0,0,0.25),
      rgba(0,0,0,0.45)
    ),
    url('./couple.jpg');
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
">

  <div style="
    padding: 35px 25px;
    width: 90%;
    max-width: 400px;
  ">

    <div style="
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 18px;
      opacity: 0.9;
    ">
      A Beautiful Beginning
    </div>


    <div style="
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: 400;
      text-shadow: 0 3px 15px rgba(0,0,0,0.7);
    ">
      Rahul &amp; Priya ❤️
    </div>


    <div style="
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      margin-top: 14px;
      opacity: 0.9;
    ">
      Our Story • Our Memories • Forever
    </div>


    <div style="
      margin-top: 45px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      padding: 14px 28px;
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 30px;
      display: inline-block;
      background: rgba(0,0,0,0.25);
    ">
      TAP TO ENTER
    </div>

  </div>

</div>


<!-- =========================
     MUSIC
========================= -->

<audio id="bgMusic">
  <source src="Dil Diyan Gallan Song.mp3" type="audio/mpeg">
</audio>


<script>

const startScreen =
  document.getElementById("startScreen");

const music =
  document.getElementById("bgMusic");

const video =
  document.querySelector(".hero video");


startScreen.addEventListener("click", function () {

  startScreen.style.display = "none";

  music.play();
  video.play();

});


music.addEventListener("ended", function () {

  video.pause();
  video.currentTime = 0;

});

</script>


</body>
</html>
