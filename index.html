<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memory ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

video {
  width: 100%;
  height: auto;
  display: block;
}

#slideshow {
  display: none;
  width: 100%;
  height: 100vh;
  max-height: 700px;
  object-fit: contain;
  background: #000;
}

.message {
  display: none;
  padding: 35px 25px;
  font-size: 20px;
  line-height: 1.7;
}

.message h1 {
  font-size: 30px;
  margin-bottom: 20px;
}

.fade {
  animation: fade 1.2s ease-in-out;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="container">

  <!-- GEMINI VIDEO -->
  <video id="introVideo" autoplay muted playsinline>
    <source src="gemini_generated_video_b0c536be.mp4" type="video/mp4">
  </video>

  <!-- PHOTO SLIDESHOW -->
  <img id="slideshow" src="" alt="Our Memories">

  <!-- MESSAGE -->
  <div id="message" class="message">
    <h1>❤️ Our Memories ❤️</h1>
    <p>
      कुछ यादें सिर्फ तस्वीरों में नहीं होतीं...<br>
      वो हमारे दिल में हमेशा रहती हैं। ❤️
    </p>
  </div>

</div>

<script>

const photos = [
  "file_000000001b6882079a850c5579532b4c.png",
  "file_0000000024ec8211bda90c4187d9e1a3.png",
  "file_0000000072108211982ce28a39d7449f.png",
  "file_00000000e6ec82118f62455f33b89614.png"
];

let currentPhoto = 0;

const video = document.getElementById("introVideo");
const slideshow = document.getElementById("slideshow");
const message = document.getElementById("message");

function startSlideshow() {

  video.style.display = "none";

  slideshow.style.display = "block";
  slideshow.src = photos[0];
  slideshow.classList.add("fade");

  currentPhoto = 0;

  const photoTimer = setInterval(() => {

    currentPhoto++;

    if (currentPhoto >= photos.length) {
      clearInterval(photoTimer);

      slideshow.style.display = "none";
      message.style.display = "block";

      return;
    }

    slideshow.classList.remove("fade");

    void slideshow.offsetWidth;

    slideshow.classList.add("fade");

    slideshow.src = photos[currentPhoto];

  }, 3000);
}

video.addEventListener("ended", startSlideshow);

</script>

</body>
</html>
