<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memories</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent: #e2b714;
      --text: #ffffff;
      --subtext: #a0a5b1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px 15px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      text-align: center;
      padding: 30px 20px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }
    .header h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent); }
    .header p { color: var(--subtext); font-size: 0.95rem; }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 15px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .card img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      max-height: 350px;
    }
    .card-caption {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--subtext);
      line-height: 1.4;
    }
    .audio-player {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Our Treasured Moments</h1>
      <p>Scan to relive our favorite memories together ✨</p>
    </div>

    <!-- Memory Card 1 -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1518173946687-a4c8a383392e?auto=format&fit=crop&w=800&q=80" alt="Memory Photo">
      <div class="card-caption">A unforgettable evening under the stars.</div>
    </div>

    <!-- Audio Memory Card -->
    <div class="card">
      <p style="margin-bottom: 8px; font-weight: 600;">Favorite Voice Note / Song</p>
      <audio class="audio-player" controls>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>
  </div>
</body>
</html>
