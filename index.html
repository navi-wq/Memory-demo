<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Love Story ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #faf7f4;
  color: #2b2522;
  text-align: center;
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  background: radial-gradient(
    circle at top,
    #fffdfb 0%,
    #f7eee9 55%,
    #eee0d9 100%
  );
}

.hero-content {
  width: 100%;
  max-width: 430px;
}

.small {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #8c7770;
  margin-bottom: 18px;
}

h1 {
  font-size: 38px;
  line-height: 1.15;
  font-weight: 500;
  margin-bottom: 14px;
}

.subtitle {
  font-family: Arial, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: #756965;
  margin-bottom: 28px;
}

.memory-photo {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  border-radius: 18px;
  display: block;
  background: #e9ddd7;
  box-shadow: 0 18px 45px rgba(60, 35, 25, 0.18);
  margin-bottom: 25px;
}

.tap-button {
  display: inline-block;
  background: #2b2522;
  color: white;
  padding: 16px 28px;
  border-radius: 50px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  text-decoration: none;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.scroll-hint {
  margin-top: 25px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: #9a8880;
}

.section {
  padding: 65px 20px;
  max-width: 700px;
  margin: auto;
}

.section-title {
  font-size: 28px;
  font-weight: 500;
  margin-bottom: 12px;
}

.section-text {
  font-family: Arial, sans-serif;
  color: #756965;
  line-height: 1.7;
  font-size: 14px;
}

.video-box {
  margin-top: 30px;
  width: 100%;
  border-radius: 18px;
  overflow: hidden;
  background: #171312;
  box-shadow: 0 15px 40px rgba(0,0,0,0.18);
}

.video-placeholder {
  height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #cfc3bd;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

.memory-card {
  margin-top: 35px;
  padding: 30px 22px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 12px 35px rgba(50,30,20,0.08);
}

.quote {
  font-size: 20px;
  line-height: 1.6;
  font-style: italic;
}

.footer {
  padding: 40px 20px 60px;
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: #a08f88;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<section class="hero">

  <div class="hero-content">

    <div class="small">
      A Memory Made Just For You
    </div>

    <h1>
      Our Love Story,<br>
      Preserved Forever ❤️
    </h1>

    <p class="subtitle">
      One beautiful moment.<br>
      One unforgettable memory.
    </p>

    <img
      class="memory-photo"
      src="IMG_20260922_124958_nggiu0 (1).jpg"
      alt="Our Memory"
    >

    <a href="#memory" class="tap-button">
      Tap to relive this memory ❤️
    </a>

    <div class="scroll-hint">
      ↓ Scroll to discover the memory
    </div>

  </div>

</section>
